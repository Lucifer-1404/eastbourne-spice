<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eastbourne Spice — Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9960C;
    --gold-light: #E8B84B;
    --gold-pale: #F5E6C0;
    --crimson: #8B1A1A;
    --crimson-dark: #5C0F0F;
    --teal: #1A5C5C;
    --cream: #FAF3E0;
    --cream-dark: #F0E4C2;
    --text: #2D1B00;
    --muted: #8B7355;
    --border: #D4A843;
    --success: #2D6B2D;
    --surface: #FAF3E0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: 'Crimson Pro', Georgia, serif;
    background: var(--cream);
    color: var(--text);
    height: 100%;
    overflow: hidden;
  }

  /* ═══════════════════════════════
     DESKTOP: side-by-side layout
  ═══════════════════════════════ */
  .app {
    display: grid;
    grid-template-columns: 1fr 400px;
    height: 100vh;
    overflow: hidden;
  }

  /* HEADER */
  .header {
    background: var(--crimson-dark);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 3px solid var(--gold);
    flex-shrink: 0;
  }
  .header-logo {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--gold-light); object-fit: cover; flex-shrink: 0;
  }
  .header-text h1 {
    font-family: 'Cinzel', serif; color: var(--gold-light);
    font-size: 17px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .header-text p { color: rgba(232,184,75,0.65); font-size: 11px; font-style: italic; }
  .header-address {
    margin-left: auto; text-align: right;
    color: rgba(232,184,75,0.7); font-size: 11px; line-height: 1.5; font-style: italic;
  }

  /* TABLE BAR */
  .table-bar {
    background: var(--crimson); padding: 8px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0;
  }
  .table-bar label { color: var(--gold-pale); font-size: 12px; letter-spacing: 0.8px; text-transform: uppercase; }
  .table-bar input, .table-bar select {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(201,150,12,0.4);
    color: white; padding: 5px 8px; border-radius: 4px;
    font-family: 'Crimson Pro', serif; font-size: 14px; outline: none;
  }
  .table-bar input::placeholder { color: rgba(255,255,255,0.4); }
  .table-bar select option { background: var(--crimson-dark); }
  .covers-wrap { display: flex; align-items: center; gap: 6px; }
  .covers-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(201,150,12,0.3); border: 1px solid var(--gold);
    color: var(--gold-light); cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .covers-btn:active { background: var(--gold); color: var(--crimson-dark); }
  .covers-num { color: white; font-size: 18px; font-weight: 600; min-width: 22px; text-align: center; }

  /* LEFT PANEL */
  .left-panel { display: flex; flex-direction: column; overflow: hidden; border-right: 2px solid var(--border); }

  /* TABS */
  .tabs {
    display: flex; background: var(--cream-dark); border-bottom: 2px solid var(--border);
    overflow-x: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 9px 16px; cursor: pointer; font-size: 12px; letter-spacing: 0.6px;
    text-transform: uppercase; font-family: 'Cinzel', serif; color: var(--muted);
    border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
  }
  .tab.active { color: var(--crimson); border-bottom-color: var(--crimson); background: white; }
  .tab:active:not(.active) { background: rgba(201,150,12,0.1); }

  /* SEARCH */
  .search-wrap { padding: 10px 16px; background: white; border-bottom: 1px solid var(--cream-dark); flex-shrink: 0; }
  .search-input {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-family: 'Crimson Pro', serif; font-size: 15px;
    background: var(--cream); color: var(--text); outline: none;
  }
  .search-input:focus { border-color: var(--crimson); }

  /* MENU GRID */
  .menu-grid {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
    align-content: start; -webkit-overflow-scrolling: touch;
  }
  .menu-grid::-webkit-scrollbar { width: 4px; }
  .menu-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .menu-item {
    background: white; border: 1px solid var(--cream-dark);
    border-radius: 8px; padding: 10px 12px; cursor: pointer;
    transition: all 0.15s; position: relative; overflow: hidden; user-select: none;
  }
  .menu-item:active { background: var(--gold-pale); border-color: var(--gold); transform: scale(0.98); }
  .item-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
  .item-desc { font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.3; margin-bottom: 4px; }
  .item-price { font-family: 'Cinzel', serif; font-size: 13px; color: var(--crimson); font-weight: 600; }
  .item-badge {
    display: inline-block; font-size: 10px; padding: 1px 4px; border-radius: 3px;
    margin-bottom: 3px; letter-spacing: 0.3px; text-transform: uppercase;
  }
  .badge-v { background: rgba(45,107,45,0.12); color: #2D6B2D; }
  .badge-spicy { background: rgba(139,26,26,0.1); color: var(--crimson); }
  .item-variants { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .variant-btn {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--cream);
    cursor: pointer; color: var(--text); transition: all 0.12s;
    font-family: 'Crimson Pro', serif; min-height: 28px;
  }
  .variant-btn:active { background: var(--gold); color: white; border-color: var(--gold); }
  .section-header {
    grid-column: 1 / -1; padding: 8px 2px 4px;
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1.2px;
    color: var(--crimson); text-transform: uppercase;
    border-bottom: 1px solid var(--cream-dark); margin-top: 6px;
  }

  /* RIGHT PANEL */
  .right-panel { display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }

  .bill-header {
    padding: 14px 18px 10px; border-bottom: 1px solid var(--cream-dark);
    flex-shrink: 0; text-align: center;
  }
  .bill-header h2 { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 1.5px; color: var(--crimson); text-transform: uppercase; }
  .bill-header p { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 2px; }

  /* ORDER LIST */
  .order-list { flex: 1; overflow-y: auto; padding: 10px 16px; -webkit-overflow-scrolling: touch; min-height: 0; }
  .order-list::-webkit-scrollbar { width: 4px; }
  .order-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .order-empty { text-align: center; padding: 30px 16px; color: var(--muted); font-style: italic; font-size: 15px; }
  .order-empty span { display: block; font-size: 32px; margin-bottom: 8px; opacity: 0.4; }

  .order-item {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 6px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid rgba(212,168,67,0.2);
  }
  .oi-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .oi-variant { font-size: 11px; color: var(--muted); font-style: italic; }
  .oi-price { font-family: 'Cinzel', serif; font-size: 13px; color: var(--crimson); white-space: nowrap; }
  .oi-controls { display: flex; align-items: center; gap: 4px; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--cream);
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    color: var(--crimson); transition: all 0.12s;
  }
  .qty-btn:active { background: var(--crimson); color: white; border-color: var(--crimson); }
  .qty-num { min-width: 20px; text-align: center; font-weight: 600; font-size: 14px; }

  /* NOTE */
  .note-wrap { padding: 6px 16px 0; flex-shrink: 0; }
  .note-wrap textarea {
    width: 100%; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: white; font-family: 'Crimson Pro', serif;
    font-size: 13px; color: var(--text); resize: none; outline: none; font-style: italic;
  }

  /* TOTALS */
  .totals { padding: 10px 16px; border-top: 2px solid var(--border); background: white; flex-shrink: 0; }
  .totals-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; color: var(--text); }
  .totals-row.subtotal { color: var(--muted); font-style: italic; }
  .totals-row.big { font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700; color: var(--crimson); border-top: 1px solid var(--border); margin-top: 5px; padding-top: 8px; }

  /* TIP */
  .tip-section { padding: 8px 0 0; }
  .tip-label { font-size: 11px; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 5px; font-family: 'Cinzel', serif; }
  .tip-btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .tip-btn { padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--cream); cursor: pointer; font-size: 13px; color: var(--text); transition: all 0.12s; font-family: 'Crimson Pro', serif; min-height: 32px; }
  .tip-btn.active { background: var(--gold); color: white; border-color: var(--gold); }
  .tip-custom { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .tip-custom input { width: 80px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; font-family: 'Crimson Pro', serif; font-size: 14px; background: white; color: var(--text); outline: none; }
  .tip-custom label { font-size: 12px; color: var(--muted); font-style: italic; }

  /* SERVICE CHARGE */
  .sc-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; }
  .sc-row label { font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .sc-toggle {
    position: relative; width: 36px; height: 20px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: var(--cream-dark); border-radius: 20px; transition: all 0.2s; border: 1px solid var(--border);
  }
  .sc-toggle::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); top: 2px; left: 2px; transition: all 0.2s; }
  .sc-toggle:checked { background: var(--gold); border-color: var(--gold); }
  .sc-toggle:checked::after { left: 18px; background: white; }
  .sc-pct { font-size: 13px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; background: white; width: 52px; text-align: center; font-family: 'Crimson Pro', serif; outline: none; color: var(--text); }

  /* PAYMENT */
  .payment { padding: 10px 16px 14px; flex-shrink: 0; }
  .pay-methods { display: flex; gap: 6px; margin-bottom: 8px; }
  .pay-btn { flex: 1; padding: 8px 4px; border-radius: 6px; border: 2px solid var(--cream-dark); background: white; cursor: pointer; text-align: center; transition: all 0.12s; font-family: 'Crimson Pro', serif; font-size: 12px; color: var(--muted); min-height: 50px; }
  .pay-btn .pay-icon { font-size: 16px; display: block; }
  .pay-btn.active { border-color: var(--crimson); color: var(--crimson); background: rgba(139,26,26,0.04); }
  .action-btns { display: flex; gap: 6px; }
  .btn-print, .btn-clear, .btn-charge {
    flex: 1; padding: 12px 8px; border-radius: 7px; border: none;
    cursor: pointer; font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 0.8px; text-transform: uppercase; transition: all 0.2s; min-height: 44px;
  }
  .btn-clear { background: var(--cream-dark); color: var(--muted); border: 1px solid var(--border); }
  .btn-print { background: var(--teal); color: white; }
  .btn-charge { background: var(--crimson-dark); color: var(--gold-light); box-shadow: 0 3px 10px rgba(92,15,15,0.25); }
  .btn-charge:active { transform: scale(0.97); }

  /* MOBILE BOTTOM NAV */
  .mobile-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--crimson-dark); border-top: 2px solid var(--gold);
    z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .mobile-nav-inner { display: flex; }
  .mob-tab {
    flex: 1; padding: 10px 4px 8px; text-align: center; cursor: pointer;
    color: rgba(232,184,75,0.5); transition: all 0.15s; border: none; background: none;
  }
  .mob-tab .mob-icon { font-size: 20px; display: block; }
  .mob-tab .mob-label { font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; font-family: 'Cinzel', serif; display: block; margin-top: 2px; }
  .mob-tab.active { color: var(--gold-light); }
  .mob-tab .mob-badge {
    display: inline-block; background: var(--gold); color: var(--crimson-dark);
    border-radius: 10px; font-size: 10px; font-weight: bold; padding: 0 5px;
    min-width: 18px; text-align: center; font-family: sans-serif;
  }

  /* MOBILE VIEW SWITCHING */
  .view-menu, .view-order { display: contents; }

  /* RECEIPT MODAL */
  .receipt-modal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(28,18,8,0.75); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 16px; }
  .receipt-modal.show { display: flex; }
  .receipt { background: white; max-width: 360px; width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); max-height: 90vh; overflow-y: auto; }
  .receipt-inner { padding: 24px; }
  .receipt-logo { text-align: center; margin-bottom: 14px; }
  .receipt-logo img { width: 64px; height: 64px; border-radius: 50%; }
  .receipt-title { text-align: center; margin-bottom: 4px; }
  .receipt-title h3 { font-family: 'Cinzel', serif; color: var(--crimson); font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
  .receipt-title p { font-size: 11px; color: var(--muted); font-style: italic; }
  .receipt-divider { border: none; border-top: 1px dashed var(--border); margin: 10px 0; }
  .receipt-meta { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 8px; }
  .receipt-item { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--text); }
  .receipt-item .ri-qty { color: var(--muted); min-width: 22px; }
  .receipt-item .ri-name { flex: 1; padding: 0 5px; }
  .receipt-item .ri-price { font-family: 'Cinzel', serif; font-size: 11px; }
  .receipt-total { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; color: var(--muted); }
  .receipt-total.grand { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; color: var(--crimson); border-top: 2px solid var(--border); margin-top: 5px; padding-top: 7px; }
  .receipt-footer { text-align: center; margin-top: 12px; font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.6; }
  .receipt-close { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .receipt-print-btn { display: block; width: 100%; padding: 12px; background: var(--crimson-dark); color: var(--gold-light); border: none; cursor: pointer; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; }

  /* TOAST */
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--success); color: white; padding: 10px 22px; border-radius: 24px; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.8px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); transition: transform 0.3s; z-index: 9999; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ═══════════════════════════════
     MOBILE / TABLET — single column
  ═══════════════════════════════ */
  @media (max-width: 768px) {
    html, body { overflow: auto; height: 100%; }

    .app {
      display: block;
      height: auto;
      min-height: 100vh;
      padding-bottom: 68px; /* space for bottom nav */
    }

    .mobile-nav { display: block; }

    /* On mobile, panels are full-width stacked pages */
    .left-panel {
      border-right: none;
      height: calc(100vh - 68px);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      transition: transform 0.3s ease;
    }
    .right-panel {
      height: calc(100vh - 68px);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    /* Active states controlled by JS */
    .left-panel.mob-active { transform: translateX(0); }
    .right-panel.mob-active { transform: translateX(0); }
    .left-panel.mob-hidden { transform: translateX(-100%); }

    /* Smaller header on mobile */
    .header { padding: 10px 14px; }
    .header-logo { width: 40px; height: 40px; }
    .header-text h1 { font-size: 14px; letter-spacing: 1px; }
    .header-text p { display: none; }
    .header-address { font-size: 10px; }

    /* Table bar wraps nicely */
    .table-bar { padding: 8px 12px; gap: 8px; }
    .table-bar label { font-size: 11px; }

    /* Bigger touch targets for menu items */
    .menu-grid { padding: 10px; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }
    .menu-item { padding: 10px; }
    .item-name { font-size: 13px; }

    /* Order panel */
    .bill-header { padding: 12px 14px 8px; }
    .order-list { padding: 8px 14px; }
    .totals { padding: 8px 14px; }
    .payment { padding: 8px 14px 12px; }
    .note-wrap { padding: 5px 14px 0; }

    /* Bigger buttons */
    .qty-btn { width: 32px; height: 32px; }
    .covers-btn { width: 32px; height: 32px; }

    .toast { bottom: 80px; }
  }

  @media (max-width: 380px) {
    .header-text h1 { font-size: 12px; }
    .header-logo { width: 36px; height: 36px; }
    .tip-btns { gap: 4px; }
    .tip-btn { padding: 4px 8px; font-size: 12px; }
    .action-btns { gap: 5px; }
    .btn-print, .btn-clear, .btn-charge { font-size: 11px; }
  }

  @media print {
    body > *:not(.receipt-modal) { display: none !important; }
    .receipt-modal { display: flex !important; position: static; background: none; padding: 0; }
    .receipt { box-shadow: none; border-radius: 0; max-height: none; overflow: visible; }
    .receipt-close, .receipt-print-btn { display: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ══════════════ LEFT PANEL — MENU ══════════════ -->

// ── MOBILE PANEL SWITCHING ──
function showPanel(panel) {
  const isMobile = window.innerWidth <= 768;
  if (!isMobile) return;
  const menuPanel = document.getElementById('panelMenu');
  const orderPanel = document.getElementById('panelOrder');
  const navMenu = document.getElementById('navMenu');
  const navOrder = document.getElementById('navOrder');

  if (panel === 'menu') {
    menuPanel.classList.add('mob-active');
    menuPanel.classList.remove('mob-hidden');
    orderPanel.classList.remove('mob-active');
    navMenu.classList.add('active');
    navOrder.classList.remove('active');
  } else {
    orderPanel.classList.add('mob-active');
    menuPanel.classList.remove('mob-active');
    menuPanel.classList.add('mob-hidden');
    navOrder.classList.add('active');
    navMenu.classList.remove('active');
  }
}

// Handle resize
window.addEventListener('resize', () => {
  const isMobile = window.innerWidth <= 768;
  const menuPanel = document.getElementById('panelMenu');
  const orderPanel = document.getElementById('panelOrder');
  if (!isMobile) {
    menuPanel.classList.remove('mob-hidden');
    menuPanel.classList.remove('mob-active');
    orderPanel.classList.remove('mob-active');
  }
});

// ══════════ STATE ══════════
let order = [];
let covers = 2;
let tipPct = 12.5;
let tipCustom = null;
let paymentMethod = "Cash";
let activeTab = Object.keys(MENU)[0];

// ══════════ TABS ══════════
function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = Object.keys(MENU).map(cat =>
    `<div class="tab${cat===activeTab?' active':''}" onclick="switchTab('${cat.replace(/'/g,"\\'")}')">${cat}</div>`
  ).join('');
}

function switchTab(cat) {
  activeTab = cat;
  document.getElementById('searchInput').value = '';
  renderTabs(); renderMenu();
}

// ══════════ MENU ══════════
function renderMenu() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('menuGrid');
  let html = '';

  const cats = q ? Object.keys(MENU) : [activeTab];
  cats.forEach(cat => {
    const items = MENU[cat].filter(i => !q || i.n.toLowerCase().includes(q));
    if(!items.length) return;
    if(q) html += `<div class="section-header">${cat}</div>`;
    items.forEach((item, idx) => {
      const price = item.p ? `£${item.p.toFixed(2)}` : '';
      const badges = (item.v ? `<span class="item-badge badge-v">V</span>` : '') +
                     (item.hot ? `<span class="item-badge badge-spicy">🌶 Hot</span>` : '');
      let variantBtns = '';
      if(item.variants) {
        variantBtns = `<div class="item-variants">${item.variants.map(v =>
          `<button class="variant-btn" onclick="addToOrder('${(item.n+' — '+v).replace(/'/g,"\\'")}',${item.vprices?item.vprices[item.variants.indexOf(v)]:item.p},event)">${v}</button>`
        ).join('')}</div>`;
      }
      const desc = item.d || item.desc || '';
      html += `<div class="menu-item" onclick="${!item.variants?`addToOrder('${item.n.replace(/'/g,"\\'")}',${item.p||0})`:''}" style="${item.variants?'cursor:default':''}">
        ${badges?`<div>${badges}</div>`:''}
        <div class="item-name">${item.n}</div>
        ${desc?`<div class="item-desc">${desc}</div>`:''}
        ${price?`<div class="item-price">${price}</div>`:''}
        ${variantBtns}
      </div>`;
    });
  });
  grid.innerHTML = html || `<div class="order-empty" style="grid-column:1/-1"><span>🔍</span>No items found</div>`;
}

// ══════════ ORDER ══════════
function addToOrder(name, price, e) {
  if(e) e.stopPropagation();
  const existing = order.find(i => i.name === name);
  if(existing) existing.qty++;
  else order.push({name, price, qty:1});
  renderOrder(); calcTotals();
  showToast(`Added: ${name.split(' — ')[0]}`);
}

function adjustQty(idx, delta) {
  order[idx].qty += delta;
  if(order[idx].qty <= 0) order.splice(idx, 1);
  renderOrder(); calcTotals();
}

function renderOrder() {
  const el = document.getElementById('orderList');
  const table = document.getElementById('tableNo').value || '—';
  document.getElementById('billMeta').textContent = `Table ${table} · ${covers} cover${covers!==1?'s':''}`;

  if(!order.length) {
    el.innerHTML = `<div class="order-empty"><span>🍽️</span>No items yet — select from the menu</div>`;
    return;
  }
  el.innerHTML = order.map((item, i) => `
    <div class="order-item">
      <div>
        <div class="oi-name">${item.name}</div>
      </div>
      <div class="oi-controls">
        <button class="qty-btn" onclick="adjustQty(${i},-1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="adjustQty(${i},1)">+</button>
      </div>
      <div class="oi-price">£${(item.price*item.qty).toFixed(2)}</div>
    </div>
  `).join('');
}

// ══════════ TOTALS ══════════
function calcTotals() {
  const subtotal = order.reduce((s,i) => s + i.price*i.qty, 0);
  const scOn = document.getElementById('scToggle').checked;
  const scPct = parseFloat(document.getElementById('scPct').value)||0;
  const sc = scOn ? subtotal * scPct/100 : 0;

  let tip = 0;
  if(tipCustom !== null) tip = tipCustom;
  else tip = subtotal * tipPct/100;

  const total = subtotal + sc + tip;

  document.getElementById('tSubtotal').textContent = '£'+subtotal.toFixed(2);
  document.getElementById('tSCLabel').textContent = scOn ? `Service Charge (${scPct}%)` : 'Service Charge';
  document.getElementById('tSC').textContent = '£'+sc.toFixed(2);
  document.getElementById('tSCRow').style.opacity = scOn ? 1 : 0.4;
  document.getElementById('tTipLabel').textContent = tipCustom!==null ? 'Gratuity (custom)' : `Gratuity (${tipPct}%)`;
  document.getElementById('tTip').textContent = '£'+tip.toFixed(2);
  document.getElementById('tTotal').textContent = '£'+total.toFixed(2);
  document.getElementById('tPerCover').textContent = covers > 0 ? '£'+(total/covers).toFixed(2) : '£0.00';
}

function setTip(pct, btn) {
  tipPct = pct; tipCustom = null;
  document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('customTip').value = '';
  calcTotals();
}

function setCustomTip(val) {
  tipCustom = val ? parseFloat(val) : null;
  document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
  calcTotals();
}

// ══════════ COVERS ══════════
function adjustCovers(d) {
  covers = Math.max(1, covers + d);
  document.getElementById('coversNum').textContent = covers;
  calcTotals();
}

// ══════════ PAYMENT ══════════
function setPayment(btn) {
  document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  paymentMethod = btn.dataset.method;
}

    <div class="receipt-title">
      <h3>Eastbourne Spice</h3>
      <p>Indian &amp; Nepalese Cuisine</p>
      <p style="font-size:11px;margin-top:2px">6 Susans Road, Eastbourne BN21 3HA<br>📞 01323 573771</p>
    </div>
    <hr class="receipt-divider">
    <div class="receipt-meta">
      ${now.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'})} &nbsp;|&nbsp;
      ${now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'})}<br>
      Table ${table} &nbsp;|&nbsp; ${covers} Cover${covers!==1?'s':''} &nbsp;|&nbsp; ${orderType}<br>
      Server: ${server}
    </div>
    <hr class="receipt-divider">
    ${order.map(i => `
      <div class="receipt-item">
        <span class="ri-qty">${i.qty}×</span>
        <span class="ri-name">${i.name}</span>
        <span class="ri-price">£${(i.price*i.qty).toFixed(2)}</span>
      </div>
    `).join('')}
    <hr class="receipt-divider">
    <div class="receipt-total"><span>Subtotal</span><span>£${subtotal.toFixed(2)}</span></div>
    ${scOn?`<div class="receipt-total"><span>Service Charge (${scPct}%)</span><span>£${sc.toFixed(2)}</span></div>`:''}
    <div class="receipt-total"><span>Gratuity</span><span>£${tip.toFixed(2)}</span></div>
    <div class="receipt-total grand"><span>TOTAL</span><span>£${total.toFixed(2)}</span></div>
    <div class="receipt-total" style="font-size:12px;color:var(--muted)"><span>Payment</span><span>${paymentMethod}</span></div>
    ${note?`<hr class="receipt-divider"><div style="font-size:12px;color:var(--muted);font-style:italic">Note: ${note}</div>`:''}
    <hr class="receipt-divider">
    <div class="receipt-footer">
      Thank you for dining with us!<br>
      Please review us on Google &amp; TripAdvisor<br>
      <strong>Eastbourne Spice — Proudly family-run</strong>
    </div>
  `;
  document.getElementById('receiptModal').classList.add('show');
}

function closeReceipt() {
  document.getElementById('receiptModal').classList.remove('show');
}

// ══════════ CHARGE ══════════
function chargeOrder() {
  if(!order.length) { showToast('Add items first'); return; }
  const total = parseFloat(document.getElementById('tTotal').textContent.replace('£',''));
  showToast(`✓ Charged £${total.toFixed(2)} via ${paymentMethod}`);
  setTimeout(() => {
    if(confirm(`Confirm charge of £${total.toFixed(2)} via ${paymentMethod}?\n\nThis will clear the order.`)) {
      clearOrder();
    }
  }, 400);
}

// ══════════ CLEAR ══════════
function clearOrder() {
  order = [];
  document.getElementById('orderNote').value = '';
  renderOrder(); calcTotals();
}

// ══════════ TOAST ══════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ══════════ INIT ══════════
renderTabs(); renderMenu(); calcTotals();
document.getElementById('tableNo').addEventListener('input', () => renderOrder());
document.getElementById('coversNum').textContent = covers;


// Update order count badge on mobile nav
const _origRenderOrder = renderOrder;
renderOrder = function() {
  _origRenderOrder();
  const count = order.reduce((s,i) => s + i.qty, 0);
  const badge = document.getElementById('orderCount');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline-block' : 'none';
  }
};

// Init
renderTabs(); renderMenu(); calcTotals();
document.getElementById('tableNo').addEventListener('input', () => renderOrder());
document.getElementById('coversNum').textContent = covers;
</script>
